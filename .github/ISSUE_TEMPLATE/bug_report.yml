name: Bug Report
description: Report a reproducible defect in DI, FBR sync, or POS fiscal flows
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        For support or setup questions, use `SUPPORT.md`.
        For security vulnerabilities, do not open an issue. Follow `SECURITY.md`.

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Describe what happened and what you expected instead.
      placeholder: A concise description of the bug.
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      options:
        - DI API integration
        - POS fiscal integration
        - Reference data sync
        - QR code generation
        - Print format
        - Setup / installation
        - Other
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Version details
      description: Share the exact versions you are running.
      placeholder: |
        Frappe version:
        ERPNext version:
        DI version:
        Python version:
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: FBR environment
      options:
        - Sandbox
        - Production
        - Both
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - bench get-app / manual install
        - Frappe Cloud
        - Docker
        - Other

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      description: Paste sanitized logs, stack traces, or payload snippets here.
      render: shell

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
